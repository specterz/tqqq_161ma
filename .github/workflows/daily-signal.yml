name: Daily 161-MA signal

# Runs after the US market close on weekdays and posts the day's signal to Discord.
# GitHub cron is UTC-only (no DST). 21:07 UTC = 4:07pm ET in winter (EST) and
# 5:07pm ET in summer (EDT) — always safely after the 4:00pm close either way.
# (Weekdays only: weekend runs would just re-report Friday's unchanged signal.)
#
# IMPORTANT: GitHub schedules are best-effort and can be delayed by HOURS during
# high load (observed ~4h late). There is no way to make cron punctual. For a
# daily close-based signal this is cosmetic — the signal is the same whenever it
# lands, and the --once-state dedupe makes a delayed/double-fired run harmless.
# An odd minute (:07) avoids the most congested top-of-hour / :15 slots.
on:
  schedule:
    # MULTIPLE ATTEMPTS to beat GitHub's cron delay. Each tick runs the job, but
    # the --once-state dedupe means only the FIRST one to actually fire each day
    # posts to Discord — the rest see "already alerted" and skip. So stacking
    # attempts just makes delivery earlier/more reliable, never duplicated.
    #
    # UTC times. US close is 21:00 UTC (EST) / 20:00 UTC (EDT); all attempts are
    # after it in both DST states. Same-UTC-day attempts use weekdays 1-5 (Mon-Fri):
    - cron: "7 21 * * 1-5"    # ~4:07pm EST / 5:07pm EDT  (just after close)
    - cron: "37 21 * * 1-5"   # +30 min
    - cron: "7 22 * * 1-5"    # +1h
    - cron: "7 23 * * 1-5"    # +2h
    # Late-evening ET crosses into the NEXT UTC day, so these use weekdays 2-6
    # (Tue-Sat) to line up with Mon-Fri evenings in ET:
    - cron: "7 0 * * 2-6"     # ~7-8pm ET
    - cron: "7 1 * * 2-6"     # ~8-9pm ET (final safety net)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # allow the commit-back step to push the refreshed CSV

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Refresh the Nasdaq-100 data first so both the email AND the commit-back
      # use the same freshly downloaded CSV.
      - name: Refresh NDX data
        run: python src/fetch_data.py --force

      # Compute today's signal and post it to Discord. --no-update because the
      # step above already fetched. The webhook URL is a repo Secret:
      #   Settings -> Secrets and variables -> Actions -> DISCORD_WEBHOOK
      - name: Post daily signal to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # --once-state dedupes: if GitHub double-fires or a delayed run retries
          # on the same signal date, the second run skips instead of double-posting.
          python src/daily_signal.py --discord --contribution 100 --no-update \
            --once-state data/.last_signal_date

      # Commit the refreshed NDX.csv back to the repo so it stays daily-fresh.
      # Only commits if the file actually changed (no-op on weekends/holidays).
      # Push is retried with rebase in case main advanced since checkout (e.g. a
      # manual push or an overlapping run) — otherwise the push races and fails.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the refreshed data AND the dedupe state file (so the "already
          # alerted today" marker persists for a later same-day run).
          git add data/NDX.csv data/.last_signal_date
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update NDX data [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on latest main..."
            git pull --rebase --autostash origin main || true
          done
          echo "Failed to push after retries." >&2
          exit 1
