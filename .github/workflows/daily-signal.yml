name: Daily 161-MA signal

# Runs once each weekday at 4:20pm ET and posts the day's signal to Discord.
# GitHub cron is UTC-only (no DST), so a single UTC time can't be 4:20pm ET
# year-round: 4:20pm ET is 20:20 UTC in summer (EDT) and 21:20 UTC in winter
# (EST). We target EDT (20:20 UTC); during EST this fires at 3:20pm ET — before
# the 4:00pm close, so it reports the prior day's confirmed signal on those days.
# (Weekdays only: weekend runs would just re-report Friday's unchanged signal.)
#
# NOTE: GitHub schedules are best-effort and can be delayed by HOURS under load.
# There is no way to make cron punctual; for a daily close-based signal this is
# cosmetic — the signal is the same whenever it lands.
on:
  schedule:
    - cron: "20 20 * * 1-5"   # 4:20pm ET (EDT) / 3:20pm ET (EST), Mon-Fri
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # allow the commit-back step to push the refreshed CSV

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Refresh both the NDX engine data and the QQQ signal data first, so the
      # signal AND the commit-back use the same freshly downloaded CSVs.
      - name: Refresh market data
        run: |
          python src/fetch_data.py --force                       # NDX (default)
          python src/fetch_data.py --force --path data/QQQ.csv --symbol QQQ

      # Compute today's signal and post it to Discord. --no-update because the
      # step above already fetched. The webhook URL is a repo Secret:
      #   Settings -> Secrets and variables -> Actions -> DISCORD_WEBHOOK
      - name: Post daily signal to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python src/daily_signal.py --discord --contribution 100 --no-update

      # Commit the refreshed NDX.csv back to the repo so it stays daily-fresh.
      # Only commits if the file actually changed (no-op on weekends/holidays).
      # Push is retried with rebase in case main advanced since checkout (e.g. a
      # manual push or an overlapping run) — otherwise the push races and fails.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the refreshed data (NDX engine + QQQ signal).
          git add data/NDX.csv data/QQQ.csv
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update NDX data [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on latest main..."
            git pull --rebase --autostash origin main || true
          done
          echo "Failed to push after retries." >&2
          exit 1
